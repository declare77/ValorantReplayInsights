name: Build Android APK

# Builds the app entirely on GitHub's own servers -- no local Android SDK, NDK, Rust toolchain,
# or terminal use required on your end. Push this file (plus the rest of android/) to your repo,
# then either wait for it to run on push, or trigger it by hand from the Actions tab
# ("Build Android APK" -> "Run workflow"). When it finishes, download the .apk from the run's
# "Artifacts" section at the bottom of the run page.

on:
  workflow_dispatch:
  push:
    branches: [ android-app, main ]
    paths: [ 'android/**', 'viewer/**', 'src/**', 'assets/**', '.github/workflows/build-android.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone vrfkit (the .vrf decoder this app bundles)
        run: git clone --depth 1 https://github.com/yakisoba0728/vrfkit.git ../vrfkit

      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cross-compile vrfkit for arm64 Android
        working-directory: ../vrfkit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o target/ndk-out build --release -p vrfkit --features export --locked

      - name: Place vrfkit binary in the app
        run: |
          mkdir -p android/VrfInsights.Android/lib/arm64-v8a
          cp ../vrfkit/target/aarch64-linux-android/release/vrfkit android/VrfInsights.Android/lib/arm64-v8a/libvrfkit.so

      - name: Fetch map/agent/weapon art from valorant-api.com
        shell: pwsh
        run: ./scripts/Fetch-Assets.ps1

      - name: Copy the viewer + art into the app's Assets
        run: |
          mkdir -p android/VrfInsights.Android/Assets/viewer android/VrfInsights.Android/Assets/assets
          cp -r viewer/. android/VrfInsights.Android/Assets/viewer/
          cp -r assets/. android/VrfInsights.Android/Assets/assets/

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build the APK
        working-directory: android/VrfInsights.Android
        # Piped through tee so the full output is both streamed live (for anyone signed in
        # watching the log) and saved to a file the next step can surface even to a viewer who
        # isn't signed in to GitHub, via the run's Summary page. PIPESTATUS[0] preserves dotnet
        # build's real exit code -- without it, the step would "succeed" because tee itself
        # exits 0 even when the command it's piping from failed.
        run: |
          set -o pipefail
          dotnet build -c Release -f net10.0-android /v:normal 2>&1 | tee build.log
        continue-on-error: true
        id: build_apk

      - name: Show build output in the run Summary (in case of failure)
        if: always()
        working-directory: android/VrfInsights.Android
        run: |
          if [ "${{ steps.build_apk.outcome }}" = "failure" ]; then
            echo "## dotnet build failed -- last 400 lines of output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 build.log | tail -n 400 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the job if the build actually failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: vrf-insights-android-apk
          path: android/VrfInsights.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error

      - name: Upload the full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/VrfInsights.Android/build.log
          if-no-files-found: ignore
